<!DOCTYPE html>
<html lang="zh-TW">
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>掃碼加入互動</title>
  <script src="https://unpkg.com/@undecaf/zbar-wasm@0.10.0/dist/index.js"></script> <!-- QR 掃描 -->
  <script src="https://cdn.jsdelivr.net/npm/osc-js@2"></script> <!-- OSC 庫 -->
  <style>
    body,html{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
    #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
    #info{position:absolute;top:0;left:0;right:0;padding:20px;text-align:center;font-size:1.5em;background:rgba(0,0,0,0.6);}
    #status{color:#0f0;}
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <div id="info">請用相機掃描大螢幕上的 QR code…</div>
  <div id="status"></div>

<script>
// 1. 開啟相機
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
  .then(stream => document.getElementById('video').srcObject = stream);

// 2. QR code 掃描器（內建相機直接掃）
const scanner = new ZBarScanner();
scanner.on('scan', result => {
  const url = new URL(result);
  if (url.protocol !== 'unityosc:') return;

  const unityIP = url.hostname;       // 例如 192.168.1.100
  const unityPort = url.port || '9000'; // OSC 接收 port
  const playerID = Math.floor(Math.random() * 9999);

  document.getElementById('info').innerHTML = `已連線！<br>你的 ID: ${playerID}<br>開始轉手機控制畫面！`;
  document.getElementById('video').style.display = 'none';

  // 3. 用 OSC over WebSocket 連到 Unity（最穩）
  const osc = new OSC({ plugin: new OSC.WebsocketClientPlugin });
  osc.open({ host: unityIP, port: 8080 });  // Unity 端的 WebSocket-OSC Bridge port

  // 4. 陀螺儀
  window.addEventListener('deviceorientation', e => {
    if (e.alpha === null) return;
    osc.send(new OSC.Message(`/gyro/${playerID}`, e.alpha, e.beta, e.gamma));
    // 或者你習慣的 address： /player/gyro ${playerID} 都可以
  });

  // iOS 點一下才給陀螺儀權限
  document.body.onclick = () => DeviceOrientationEvent.requestPermission?.();
});

// 每秒掃描一次
setInterval(() => scanner.scanFromVideo(document.getElementById('video')), 1000);
</script>
</body>
</html>
