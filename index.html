<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub JSON Uploader for Unity</title>
</head>
<body>
  <h2>Upload Game JSON to GitHub</h2>

  <input type="file" id="jsonFile" accept=".json,application/json" /><br><br>
  <button id="uploadBtn">Upload & Replace JSON</button>
  <p id="status">No file selected.</p>

  <script>
    // ⚠️ 請修改以下設定
    const GITHUB_USERNAME = "BabYfuzao"; // 你的 GitHub 帳號
    const REPO_NAME = "Unity Quiz Uploader";         // 你的 Repository 名稱
    const FILE_PATH = "quizJsonFile.json";      // 檔案在 repo 中的路徑/檔名
    const GITHUB_TOKEN = "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";   // 剛剛產生的 Token (注意保密)

    const uploadBtn = document.getElementById("uploadBtn");
    const statusText = document.getElementById("status");

    uploadBtn.addEventListener("click", async () => {
      const fileInput = document.getElementById("jsonFile");
      const file = fileInput.files[0];

      if (!file) {
        statusText.textContent = "Please select a JSON file.";
        return;
      }

      if (!file.name.toLowerCase().endsWith(".json")) {
        statusText.textContent = "Only .json files are allowed.";
        return;
      }

      statusText.textContent = "Reading file...";

      try {
        // 將檔案轉換成 Base64 格式（GitHub API 上傳檔案的規定格式）
        const base64Content = await toBase64(file);

        statusText.textContent = "Checking existing file SHA...";
        
        // 1. 先向 GitHub API 查詢該檔案是否已經存在（需要取得它的 SHA 碼才能進行覆蓋更新）
        const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
        
        let fileSha = null;
        const getRes = await fetch(apiUrl, {
          headers: {
            "Authorization": `Bearer ${GITHUB_TOKEN}`
          }
        });

        if (getRes.ok) {
          const fileData = await getRes.json();
          fileSha = fileData.sha; // 如果檔案已存在，抓取其 SHA
        }

        statusText.textContent = "Uploading to GitHub...";

        // 2. 發送 PUT 請求上傳/覆蓋檔案
        const bodyData = {
          message: "Update quizJsonFile.json via Web Uploader",
          content: base64Content
        };

        if (fileSha) {
          bodyData.sha = fileSha; // 覆蓋現有檔案必須帶上原本的 sha
        }

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyData)
        });

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(errData.message || "Upload failed");
        }

        statusText.textContent = "Upload successful! JSON updated on GitHub.";
      } catch (err) {
        statusText.textContent = "Upload failed: " + err.message;
      }
    });

    // 輔助函式：將檔案轉為 Base64
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
