<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公開 JSON 上傳工具</title>
</head>
<body>
  <h2>上傳遊戲 JSON 到 GitHub</h2>
  <input type="file" id="jsonFile" accept=".json,application/json" /><br><br>
  <button id="uploadBtn">上傳並覆蓋</button>
  <p id="status">尚未選擇檔案。</p>

  <script>
    const uploadBtn = document.getElementById("uploadBtn");
    const statusText = document.getElementById("status");

    uploadBtn.addEventListener("click", async () => {
      const fileInput = document.getElementById("jsonFile");
      const file = fileInput.files[0];

      if (!file) {
        statusText.textContent = "請先選擇一個 JSON 檔案。";
        return;
      }

      statusText.textContent = "讀取檔案中...";

      try {
        const base64Content = await toBase64(file);
        statusText.textContent = "正在上傳至伺服器...";

        // 呼叫我們自己的 API（不需要暴露 Token）
        const response = await fetch('/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            filename: file.name,
            content: base64Content
          })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.message);

        statusText.textContent = "上傳成功！JSON 已經更新。";
      } catch (err) {
        statusText.textContent = "上傳失敗：" + err.message;
      }
    });

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
