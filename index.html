<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game JSON Uploader</title>
</head>
<body>
  <h2>Upload Game JSON</h2>

  <input type="file" id="jsonFile" accept=".json,application/json" />
  <button id="uploadBtn">Upload</button>
  <p id="status">No file selected.</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://YOUR_PROJECT_ID.supabase.co";
    const supabaseKey = "YOUR_ANON_KEY_OR_ADMIN_KEY";

    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const uploadBtn = document.getElementById("uploadBtn");
    const statusText = document.getElementById("status");

    uploadBtn.addEventListener("click", async () => {
      const fileInput = document.getElementById("jsonFile");
      const file = fileInput.files[0];

      if (!file) {
        statusText.textContent = "Please select a JSON file.";
        return;
      }

      if (!file.name.toLowerCase().endsWith(".json")) {
        statusText.textContent = "Only .json files are allowed.";
        return;
      }

      try {
        statusText.textContent = "Uploading...";
        const { data, error } = await supabase.storage
          .from("game-json")
          .upload("game-data.json", file, {
            cacheControl: "0",
            upsert: true,
            contentType: "application/json"
          });

        if (error) throw error;

        statusText.textContent = "Upload successful. Game JSON updated.";
      } catch (err) {
        statusText.textContent = "Upload failed: " + err.message;
      }
    });
  </script>
</body>
</html>
